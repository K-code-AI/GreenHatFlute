name: Graphics glitch
description: Missing or broken objects, wrong textures or colours, flicker, black or frozen picture.
labels: [bug, graphics]
body:
  - type: markdown
    attributes:
      value: |
        Known glitches are tracked in the pinned [roadmap](https://github.com/K-code-AI/GreenHatFlute/blob/main/CONTRIBUTING.md) (for example the empty colour grading LUT and the checkerboard textures).

        Do not attach or link game files, keys, firmware, builds, shader caches or screenshots of the game. Describe what you see instead. Issues that break this are closed.
  - type: checkboxes
    id: duplicates
    attributes:
      label: Existing issues
      options:
        - label: I read the roadmap and [searched open and closed issues](https://github.com/K-code-AI/GreenHatFlute/issues?q=is%3Aissue) for this glitch.
          required: true
  - type: input
    id: version
    attributes:
      label: Commit
      description: The commit you built, from `git rev-parse --short HEAD`.
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: GPU, driver and Linux distribution
      description: For example "NVIDIA RTX 4070, driver 570.172, Fedora 42" or "RX 7800 XT, Mesa 25.1, Arch".
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What looks wrong, where and when
      description: Which scene, what should be there, what is there instead. Does it show all the time or after some time?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Attach build/oot111/logs/totk.log, or last-run-errors.log from the folder of play/run.sh. Lines with "validation", "shader" or "nvn2" are the interesting ones.
    validations:
      required: true
