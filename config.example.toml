# Copy to config.local.toml (ignored by git) and point it at your own files.
#
# This file is only for the path inherited from the project this one comes from: the NSP/XCI extractor with hactool
# (tools/extract.py, tools/extract_fonts.py), which builds *Tears of the Kingdom* with `--version v121` or `v143`
# (docs/architecture.md, "Inherited ... and unused by this build"). The game GreenHatFlute runs is built by
# `./build.sh --game your-game.nup` from a .nup, and needs none of this.

[input]
# Base game 1.0.0, title id 0100F2C0115B6000, as NSP or XCI.
base = '/home/YOU/games/totk/base.nsp'
# Cumulative update NSPs, title id 0100F2C0115B6800. Each is identified by its code hash; 1.4.3 and 1.2.1 are supported.
# Leave the list empty for 1.0.0 only.
updates = ['/home/YOU/games/totk/update-1.4.3.nsp']
# Keys dumped from your own console. Never printed or copied by the tools.
keys = '/home/YOU/.switch/prod.keys'
# Optional: a firmware NCA directory (an unpacked firmware, or an emulator's installed registered/ directory).
# tools/extract_fonts.py takes the system shared fonts from it; the game needs them only with Chinese or Korean text.
# firmware = '/home/YOU/.switch/firmware'

[work]
# Extracted files, generated C and builds go here. Allow about 60 GB.
dir = 'build'
